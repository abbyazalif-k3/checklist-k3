<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172536"><link rel="manifest" href="manifest.json">
<title>Checklist Inspeksi K3 Tambang</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#17202a;font-family:Arial,Helvetica,sans-serif}
header{background:#172536;color:white;padding:18px 16px;border-bottom:7px solid #f4b400;position:sticky;top:0;z-index:10}
.brand{display:flex;gap:12px;align-items:center}.logo{width:52px;height:52px;background:#f4b400;color:#172536;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:19px}.title{font-size:20px;font-weight:800}.sub{font-size:13px;color:#dce5ec;margin-top:4px}
main{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;margin-bottom:16px;box-shadow:0 3px 12px #00000012;overflow:hidden}.card h2{margin:0;padding:15px 16px;background:#263b4d;color:#fff;font-size:18px;border-left:7px solid #f4b400}
.form{padding:16px;display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}label{font-weight:700;color:#34404a}input,select,textarea{width:100%;padding:13px;border:1px solid #cbd2d8;border-radius:10px;font-size:16px;margin-top:6px;background:white}textarea{min-height:60px;resize:vertical}.full{grid-column:1/-1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:800;background:#f4b400;color:#172536}.btn.secondary{background:#e7edf1}.btn.danger{background:#d94a4a;color:white}.status{padding:0 16px 12px;color:#2d6a43;font-size:13px}.empty{padding:24px;text-align:center;color:#77828c}
.section{margin:12px 16px;border:1px solid #d4dce2;border-radius:12px;overflow:hidden}.section-title{background:#e9eef2;padding:11px 13px;font-weight:900;display:flex;justify-content:space-between}.section-title small{font-weight:600;color:#667}
.item{padding:14px;border-top:1px solid #e0e5e8}.item-head{display:grid;grid-template-columns:30px 1fr;gap:7px;line-height:1.4}.rating{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}.label{font-size:13px;font-weight:800;margin-right:2px}.rating button{border:1px solid #bcc6ce;background:#fff;border-radius:8px;padding:7px 9px;font-weight:700}.rating button.selected{background:#172536;color:#fff;border-color:#172536}
.history-card{border-top:1px solid #e0e5e8;padding:14px 16px}.history-card b{font-size:16px}.history-card div,.history-card small{display:block;margin-top:4px;color:#5c6871}.history-actions{display:flex!important;gap:7px!important;flex-wrap:wrap;margin-top:10px!important}.history-actions button{border:0;border-radius:8px;padding:8px 11px;background:#e7edf1;font-weight:700}.history-actions .danger{background:#d94a4a;color:white}
@media(max-width:700px){.form{grid-template-columns:1fr}.full{grid-column:auto}.title{font-size:17px}.section{margin:10px}.item{padding:12px}}
</style></head>
<body>
<header><div class="brand"><div class="logo">K3</div><div><div class="title">CHECKLIST INSPEKSI K3 TAMBANG</div><div class="sub">Checklist digital • HP, tablet, maupun laptop</div></div></div></header>
<main>
<div class="card"><h2>📋 INFORMASI INSPEKSI</h2><div class="form">
<label>Nama Pemeriksa / Inspektur *<input id="inspector" placeholder="Nama pemeriksa"></label>
<label>Crew / Shift *<select id="shift"><option value="">-- Pilih --</option><option>DS — Day Shift</option><option>NS — Night Shift</option></select></label>
<label>Area Kerja / Zona *<select id="area"></select></label>
<label>Tanggal & Waktu *<input id="datetime" type="datetime-local"></label>
</div></div>
<div class="card"><h2>🛡️ CHECKLIST INSPEKSI <span id="count" style="float:right;font-size:12px;font-weight:600"></span></h2><div id="checklist"></div>
<div class="toolbar"><button class="btn" id="save">💾 Simpan Inspeksi</button><button class="btn secondary" id="reset">↺ Kosongkan Form</button></div><div class="status" id="status">Data yang disimpan berada di penyimpanan lokal perangkat/browser ini.</div></div>
<div class="card"><h2>🗂️ DATA INSPEKSI TERSIMPAN</h2><div class="toolbar"><button class="btn secondary" id="exportAll">⬇️ Arsip Semua Data</button><button class="btn danger" id="clearAll">Hapus Semua Data</button></div><div id="history"></div></div>
</main>
<script>const DATA={"Elution Area": {"code": "TT-PRO-FO-62-001", "sections": {"GENERAL": ["Periksa kerapihan/kebersihan semua area, termasuk area bund, catwalks, grid mesh dan akses jalan terbebas dari bahaya tersandung, sampah, dan semua selang yang tidak digunakan telah digulung rapi", "Periksa kondisi flooring", "Periksa apakah Safety Showers/Eyewash berfungsi", "Periksa tempat sampah tidak penuh", "Periksa apakah Fire Extinguisher ada pada tempatnya", "Periksa suplai air decant di area elution", "Periksa kondisi sump pump di area elution", "Periksa timbunan oli di lantai heater dan bersihkan jika ada", "Periksa pH meter portable berfungsi dengan baik dan disimpan secara tepat (probe terendam air)", "Periksa kondisi instrument pengukur seperti pressure gauge, level sensor, dan flow sensor."], "CARBON SCREEN": ["Periksa kebersihan dan ketersediaan semua carbon de-watering screens", "Periksa kebocoran pipa dan sumbatan di water sprays", "Periksa panel screen tidak tersumbat", "Periksa baut pada vibrator screen"], "ACID COLUMN": ["Periksa kebocoran di semua tangki, pipa dan area bunded", "Periksa kebocoran dari strainer di dalam acid column", "Periksa kondisi valve di top dan bottom column"], "ELUTION COLUMN": ["Periksa status dan kesiapan elution column", "Periksa level oli di elution heater", "Periksa kondisi erat penahan cover strainer", "Periksa kondisi O-ring bracket strainer", "Periksa kebocoran oli di elution heater", "Periksa kebocoran di line sianida", "Periksa kebocoran di line caustic soda", "Periksa kondisi filter", "Periksa dan pastikan tidak ada kebocoran di elution circuit", "Periksa kondisi relief valve di elution column 1 dan 2", "Periksa kebocoran di heat exchanger", "Periksa kondisi pompa sulphamic acid dan unit tangki mixing", "Apakah ada injeksi sulphamic acid ke Heat Exchanger."], "ELECTROWINNING": ["Periksa kebocoran di semua tangki, pipa dan area bunded", "Periksa rectifier berfungsi normal"], "REAGEN KILN": ["Periksa status dan kesiapan kiln", "Periksa kebocoran pada semua pipa dan pompa", "Periksa level karbon di kiln hopper dan quench tank", "Periksa kondisi pompa transfer karbon di quench tank", "Periksa kondisi air flushing", "Periksa kondisi pompa 62PU009", "Periksa kondisi pompa 62PU008", "Periksa temperatur kiln", "Periksa kondisi screw feeder", "Periksa kondisi burner", "Periksa kondisi sistem sprinkler"], "REAGEN DAN PENGGUNAANNYA": ["Periksa level tangki storage acid, kebocoran pipa, kebersihan bund dan kesiapan pompa untuk dipompakan", "Periksa level tangki solar dan level burner oil", "Periksa dan pastikan air di dalam prep tank dalam kondisi penuh"]}}, "Mill #3 dan Scat Crusher": {"code": "TT-PRO-FO-32-002", "sections": {"AREA LANTAI DASAR": ["Kebersihan area umum", "Kondisi IBC level penampung oli dan grease", "Kondisi sump pump dan screen", "Kondisi pompa discharge ball mill", "Kondisi lantai dari tumpahan oli / grease", "Kondisi air untuk gland packing", "Kondisi lampu dan penerangan", "Periksa kondisi pompa standby untuk ball mill discharge", "Periksa kondisi pompa gland seal", "Periksa kondisi tangki gland seal", "Level grease ball mill dalam drum (%)", "Periksa ukuran keluaran material dari trommel ball mill"], "AREA OLI PELUMAS": ["Kondisi Ball Mill Lube System dan oil trap", "Level Ball Mill Lube Oil (%)", "Tekanan pompa Ball Mill bearing lube", "Tekanan pompa Ball Mill gear box", "Tekanan pompa Ball Mill motor lube oil", "Tekanan oli pompa high pressure Ball Mill (kPa)", "Tekanan oli pompa low pressure Ball Mill (kPa)", "Level gauge"], "AREA BALL MILL": ["Kebersihan lantai", "Kondisi mur dan baut mill", "Kondisi feed chute mill", "Kondisi inching drive mill", "Kondisi Fire Hydrant Hose Reel, valve dan nozzle", "Kondisi APAR, safety shower dan eye wash", "Kondisi level ball mill hopper dan sensor level (%)", "Periksa apakah ada air yang keluar dari trunnion mill", "Periksa level hopper bola baja", "Periksa auto feeder bola baja"], "AREA CYCLONE": ["Kebersihan lantai", "Kebersihan cyclone", "Kondisi discharge cyclone O/F", "Kondisi discharge cyclone U/F", "Pressure Cyclone Distributor (kPa)", "Periksa kebocoran di air tubing hose", "Periksa kebocoran di cyclone"], "AREA OVERHEAD CRANE": ["Periksa kondisi umum crane", "Periksa kondisi kabel hoist / hoist cable (sling)", "Periksa kondisi remote atau pendant control"], "SCAT CRUSHER": ["Kondisi conveyor belt dan roller sistem scat", "Periksa kondisi skirting, roller, dan scrapper CV05, 06, dan 07", "Kondisi walk way sekitar conveyor scat crusher", "Periksa flop gate konveyor 04", "Periksa kecepatan vibrator feeder", "Periksa kondisi motor scat crusher", "Periksa kondisi V-belt motor", "Periksa level oli hidrolik dan lube grease", "Periksa amperemeter dan kW", "Periksa magnet separator CV07", "Periksa motor konveyor scat", "Periksa ukuran material scat, apakah perlu dilakukan adjust scat crusher?", "Periksa mantel dan concave", "Kondisi safety guard dari mill", "Kondisi safety sign", "Kondisi lampu dan penerangan"]}}, "Reagent Mixing Area": {"code": "TT-PRO-FO-71-001", "sections": {"APD": ["Periksa full face respirator dalam kondisi bersih, tidak ada goresan dan Anda dapat melihat dengan jelas", "Periksa masker muka dalam kondisi baik dan menutup rapat", "Periksa kanister respirator yang digunakan telah tepat dan tidak kedaluwarsa", "Periksa sarung tangan PVC, pakaian coverall dan sepatu boot karet sudah tersedia"], "GENERAL": ["Periksa kebutuhan pencampuran reagent harian dengan supervisor", "Periksa kebersihan area secara umum, kebersihan di dalam area bunded, potensi bahaya tersandung dan sampah di area grid mesh dan jalan umum serta semua selang digulung dengan rapi saat tidak digunakan", "Periksa semua safety shower/eyewash berfungsi baik", "Periksa MSDS dan rambu-rambu keselamatan terpasang dan dapat terlihat dengan jelas", "Periksa tempat sampah telah dikosongkan", "Periksa APAR terpasang di tempatnya", "Periksa kondisi lantai dari karatan", "Periksa Hose Rail", "Pemeriksaan pre-start Overhead Crane telah dilakukan", "Periksa kontainer yang sudah penuh dan laporkan agar dipindahkan", "Pastikan karung bekas tidak tercampur dengan karung lain terutama untuk sianida dan lime", "Pisahkan palet yang masih bisa dipakai dengan palet yang sudah rusak dan pastikan palet tidak menumpuk dan menghalangi fasilitas emergency (fire hydrant)"], "AREA MIXING": ["Periksa tidak ada suara aneh, panas, getaran dan kebocoran oli dari agitator tangki mixing", "Periksa tumpahan atau sampah di sekitar area", "Periksa kebocoran di tangki mixing dan storage", "Periksa retakan dan kebocoran di dinding bunded", "Periksa ketersediaan pompa transfer dan dosing pump", "Periksa kebocoran di pipa", "Periksa sump pump berfungsi dan tidak ada kebocoran di pipa", "Periksa screen sump pump dari sumbatan/kotoran"], "PENYIMPANAN REAGEN": ["Periksa stok reagent mencukupi kebutuhan harian", "Periksa kerusakan pada karung reagent dan tumpahan. Bersihkan tumpahan secepatnya."], "WATER TREATMENT PLANT": ["Periksa kebersihan area kontainer WTP", "Periksa tekanan saringan dan lakukan backflush"]}}};</script>
<script>
const $ = s => document.querySelector(s);
const state = {records: JSON.parse(localStorage.getItem('k3_records') || '[]')};

function nowLocal(){
 
 const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderAreas() {
  const area = document.getElementById("area");

  area.innerHTML = `
    <option value="">-- Pilih area --</option>
    <option value="Elution Area">Elution Area</option>
    <option value="Mill #3 dan Scat Crusher">Mill #3 dan Scat Crusher</option>
    <option value="Reagent Mixing Area">Reagent Mixing Area</option>
  `;
}
function renderChecklist(){
  const area=$('#area').value, wrap=$('#checklist');
  wrap.innerHTML='';
  if(!area){wrap.innerHTML='<div class="empty">Pilih area untuk menampilkan checklist.</div>'; return;}
  let no=0;
  for(const [section,items] of Object.entries(DATA[area].sections)){
    const sec=document.createElement('section'); sec.className='section';
    sec.innerHTML=`<div class="section-title"><span>${section}</span><small>${items.length} item</small></div>`;
    items.forEach((text,i)=>{
      no++;
      const id=`item-${no}`;
      const row=document.createElement('div'); row.className='item';
      row.innerHTML=`
        <div class="item-head"><b>${no}.</b><span>${text}</span></div>
        <div class="rating">
          <span class="label">Peringkat:</span>
          <button type="button" data-rate="1">1 — Tidak Aman</button>
          <button type="button" data-rate="2">2 — Normal</button>
          <button type="button" data-rate="3">3 — Sangat Normal</button>
        </div>
        <textarea placeholder="Temuan / catatan (opsional)" aria-label="Temuan"></textarea>`;
      row.dataset.section=section; row.dataset.text=text; row.dataset.no=no;
      row.querySelectorAll('[data-rate]').forEach(btn=>btn.onclick=()=>{
        row.querySelectorAll('[data-rate]').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected'); row.dataset.rating=btn.dataset.rate;
      });
      sec.appendChild(row);
    });
    wrap.appendChild(sec);
  }
  $('#count').textContent=no+' item';
}
function collect(){
  const area=$('#area').value;
  const items=[...document.querySelectorAll('.item')].map(x=>({
    no:Number(x.dataset.no), section:x.dataset.section, description:x.dataset.text,
    rating:x.dataset.rating||'', finding:x.querySelector('textarea').value.trim()
  }));
  return {
    id:Date.now(), inspector:$('#inspector').value.trim(), shift:$('#shift').value,
    area, code:DATA[area]?.code||'', datetime:$('#datetime').value, items,
    savedAt:new Date().toISOString()
  };
}
async function save(){
  if(!$('#inspector').value.trim()||!$('#shift').value||!$('#area').value){
    alert('Lengkapi Nama Pemeriksa, Shift, dan Area terlebih dahulu.');
    return;
  }

  const r=collect();

  try {
    $('#status').textContent='Menyimpan data ke server...';

    const response=await fetch('/api/inspections',{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify(r)
    });

    const result=await response.json();

    if(!response.ok||!result.berhasil){
      throw new Error(result.error||'Gagal menyimpan data ke server.');
    }

    // Backup lokal
    state.records.unshift(r);

    $('#status').textContent=
      `Tersimpan ke server: ${new Date().toLocaleString('id-ID')}`;

    alert('Checklist berhasil disimpan ke server.');

    await renderHistory();

  } catch(error) {
    console.error(error);

    // Jika server gagal, tetap simpan lokal
    state.records.unshift(r);
    localStorage.setItem('k3_records',JSON.stringify(state.records));

    $('#status').textContent=
      'Server tidak tersedia. Data disimpan sementara di perangkat.';

    alert(
      'Server tidak dapat dihubungi.\n\n' +
      'Data tetap disimpan di perangkat sebagai backup.'
    );

    renderHistory();
  }
}
async function renderHistory(){
  const h = $('#history');

  try {
    const response = await fetch(API_URL);
    const result = await response.json();

    if(!response.ok || !result.berhasil){
      throw new Error(result.message || 'Gagal mengambil data inspeksi');
    }

    state.records = result.data || [];

    if(!state.records.length){
      h.innerHTML = '<div class="empty">Belum ada inspeksi tersimpan.</div>';
      return;
    }

    h.innerHTML = state.records.map((r,i)=>`
      <div class="history-card">
        <b>${r.area || '-'}</b>
        <div>${r.inspector || '-'} • ${r.shift || '-'}</div>
        <small>
          ${new Date(r.datetime || r.savedAt).toLocaleString('id-ID')}
          • ${(r.items || []).length} item
        </small>

        <div class="history-actions">
          <button onclick="viewRecord(${i})">Lihat</button>
<button onclick="downloadRecord(${i})">JSON</button>
<button class="danger" onclick="deleteRecord(${i})">Hapus</button>
        </div>
      </div>
    `).join('');

  } catch(error) {
    console.error('Gagal mengambil riwayat:', error);

    if(state.records.length){
      h.innerHTML = state.records.map((r,i)=>`
        <div class="history-card">
          <b>${r.area || '-'}</b>
          <div>${r.inspector || '-'} • ${r.shift || '-'}</div>
          <small>
            ${new Date(r.datetime || r.savedAt).toLocaleString('id-ID')}
            • ${(r.items || []).length} item
          </small>

          <div class="history-actions">
            <button onclick="viewRecord(${i})">Lihat</button>
            <button onclick="downloadRecord(${i})">JSON</button>
          </div>
        </div>
      `).join('');
    } else {
      h.innerHTML =
        '<div class="empty">Gagal mengambil data dari server.</div>';
    }
  }
}
window.viewRecord=i=>{
  const r=state.records[i], rated=r.items.filter(x=>x.rating).length, findings=r.items.filter(x=>x.finding).length;
  alert(`Area: ${r.area}\nPemeriksa: ${r.inspector}\nShift: ${r.shift}\nPeringkat terisi: ${rated}/${r.items.length}\nTemuan dicatat: ${findings}\n\nGunakan tombol JSON untuk arsip data.`);
};
window.downloadRecord=i=>{
  const r=state.records[i], a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}));
  a.download=`checklist-k3-${r.area.replaceAll(' ','-')}-${r.id}.json`; a.click(); URL.revokeObjectURL(a.href);
};
window.deleteRecord = async i => {
  const r = state.records[i];

  if (!r) return;

  if (!confirm(`Hapus inspeksi ${r.area} dari server?`)) return;

  try {
    const response = await fetch(`${API_URL}/${r.id}`, {
      method: 'DELETE'
    });

    const result = await response.json();

    if (!response.ok || !result.berhasil) {
      throw new Error(result.error || 'Gagal menghapus data.');
    }

    alert('✅ Inspeksi berhasil dihapus dari Supabase.');

    await renderHistory();

  } catch (error) {
    console.error('Gagal menghapus inspeksi:', error);

    alert(
      '❌ Gagal menghapus inspeksi dari server.\n\n' +
      error.message
    );
  }
};
$('#area').onchange=renderChecklist;
$('#datetime').value=nowLocal();
$('#save').onclick=save;
$('#reset').onclick=()=>{if(confirm('Kosongkan checklist yang sedang diisi?')){document.querySelectorAll('textarea').forEach(x=>x.value='');document.querySelectorAll('[data-rate]').forEach(x=>x.classList.remove('selected'));}};
$('#clearAll').onclick = async () => {
  if (!confirm('Hapus SEMUA data inspeksi dari Supabase?')) return;

  try {
    const response = await fetch(API_URL, {
      method: 'DELETE'
    });

    const result = await response.json();

    if (!response.ok || !result.berhasil) {
      throw new Error(result.error || 'Gagal menghapus semua data.');
    }

    state.records = [];
    localStorage.removeItem('k3_records');

    alert('✅ Semua data inspeksi berhasil dihapus dari Supabase.');

    await renderHistory();

  } catch (error) {
    console.error('Gagal menghapus semua data:', error);

    alert(
      '❌ Gagal menghapus semua data.\n\n' +
      error.message
    );
  }
};
$('#exportAll').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state.records,null,2)],{type:'application/json'}));a.download='arsip-checklist-k3.json';a.click();};
const API_URL = "/api/inspections";
renderAreas(); renderHistory();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
<script>

document.getElementById("save").addEventListener("click", async () => {
  const inspector = document.getElementById("inspector").value.trim();
  const shift = document.getElementById("shift").value;
  const area = document.getElementById("area").value;
  const datetime = document.getElementById("datetime").value;

  if (!inspector || !shift || !area || !datetime) {
    alert("Lengkapi Nama Pemeriksa, Shift, Area, dan Tanggal/Waktu.");
    return;
  }

  const items = [];

  document.querySelectorAll(".item").forEach((row, index) => {
    const text = row.querySelector(".item-head span")?.textContent?.trim() || "";

    const selected = row.querySelector("button.selected");
    const rating = selected?.dataset.rate || "";

    const finding =
      row.querySelector("textarea")?.value?.trim() || "";

    const section =
      row.closest(".section")?.querySelector(".section-title span")
        ?.textContent?.trim() || "";

    items.push({
      no: index + 1,
      section,
      description: text,
      rating,
      finding
    });
  });

  const payload = {
    inspector,
    shift,
    area,
    code: DATA[area]?.code || "",
    datetime: new Date(datetime).toISOString(),
    items
  };

  try {
    document.getElementById("status").textContent =
      "⏳ Menyimpan ke server...";

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (!response.ok || !result.berhasil) {
      throw new Error(
        result.pesan || result.message || "Gagal menyimpan"
      );
    }

    document.getElementById("status").textContent =
      "✅ Berhasil tersimpan ke Supabase.";

    alert("✅ Inspeksi berhasil disimpan ke Supabase.");

    console.log("SUPABASE:", result);

  } catch (error) {
    console.error(error);

    document.getElementById("status").textContent =
      "❌ Gagal menyimpan ke server.";

    alert("❌ Gagal menyimpan:\n" + error.message);
  }
});
</script></body></html>
